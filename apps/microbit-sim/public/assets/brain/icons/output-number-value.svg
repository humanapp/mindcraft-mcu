<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
            <feFlood flood-color="#ffffff" result="white"/>
            <feComposite in="white" in2="dilated" operator="in" result="outline"/>
            <feMerge>
                <feMergeNode in="outline"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g filter="url(#halo)">
        <path d="M 27.5 17 L 27.5 47" fill="none" stroke="#262b33" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M 36.5 17 L 36.5 47" fill="none" stroke="#262b33" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M 19.5 26 L 44.5 26" fill="none" stroke="#262b33" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M 19.5 38 L 44.5 38" fill="none" stroke="#262b33" stroke-width="3.4" stroke-linecap="round"/>
    </g>
</svg>
