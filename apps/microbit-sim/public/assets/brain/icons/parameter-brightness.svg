<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
            <feFlood flood-color="#ffffff" result="white"/>
            <feComposite in="white" in2="dilated" operator="in" result="outline"/>
            <feMerge>
                <feMergeNode in="outline"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g filter="url(#halo)">
        <circle cx="32" cy="32" r="10" fill="#ff7a70" fill-opacity="0.35"/>
        <rect x="26" y="26" width="12" height="12" rx="3" fill="#ff7a70"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(0 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(45 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(90 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(135 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(180 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(225 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(270 32 32)"/>
        <rect x="30.75" y="8" width="2.5" height="9" rx="1.25" fill="#d9b23d" transform="rotate(315 32 32)"/>
    </g>
</svg>
