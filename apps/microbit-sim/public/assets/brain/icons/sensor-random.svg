<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
            <feFlood flood-color="#ffffff" result="white"/>
            <feComposite in="white" in2="dilated" operator="in" result="outline"/>
            <feMerge>
                <feMergeNode in="outline"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g filter="url(#halo)">
        <g transform="rotate(12 32 32)">
            <rect x="14" y="14" width="36" height="36" rx="6" fill="#f5f7fa" stroke="#262b33" stroke-width="1.6"/>
            <circle cx="23" cy="23" r="2.8" fill="#262b33"/>
            <circle cx="41" cy="23" r="2.8" fill="#262b33"/>
            <circle cx="32" cy="32" r="2.8" fill="#262b33"/>
            <circle cx="23" cy="41" r="2.8" fill="#262b33"/>
            <circle cx="41" cy="41" r="2.8" fill="#262b33"/>
        </g>
        <path d="M 51.6 12 L 58.4 12 M 55 8.6 L 55 15.4" fill="none" stroke="#d9b23d" stroke-width="2.2" stroke-linecap="round"/>
    </g>
</svg>
