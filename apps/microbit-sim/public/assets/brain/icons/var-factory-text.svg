<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="halo" x="-15%" y="-15%" width="130%" height="130%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="dilated"/>
            <feFlood flood-color="#ffffff" result="white"/>
            <feComposite in="white" in2="dilated" operator="in" result="outline"/>
            <feMerge>
                <feMergeNode in="outline"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g filter="url(#halo)">
        <text x="32" y="34" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#262b33" text-anchor="middle" dominant-baseline="central">abc</text>
        <path d="M 8 22 L 12 22 L 9.5 29 L 7 29 Z M 14 22 L 18 22 L 15.5 29 L 13 29 Z" fill="#d9b23d"/>
        <path d="M 56 42 L 52 42 L 54.5 35 L 57 35 Z M 50 42 L 46 42 L 48.5 35 L 51 35 Z" fill="#d9b23d"/>
    </g>
</svg>
